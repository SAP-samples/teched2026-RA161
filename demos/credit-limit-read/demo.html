RVB:API_CRDTMBUSINESSPARTNER), retrieved 15 Oct 2026."}, "protocol": {"value": "OData V2", "status": "verified", "evidence": "Service bindingVersion and metadataVersion are V2. Entity metadata protocol is V2."}, "release_state": {"value": "RELEASED", "status": "verified", "evidence": "Service releaseState=RELEASED, contract=C2 in the graph; tenant activation was not tested."}, "service_package": {"value": "ODATA_CREDIT_MGMT_MASTER", "status": "verified", "evidence": "Service node package, confirmed by search_nodes and get_node_details."}, "endpoint": {"value": "/sap/opu/odata/sap/API_CRDTMBUSINESSPARTNER", "status": "verified", "evidence": "Service endpointUrl in the graph; SAP Help Operations for Credit Management Master Data confirms the relative service path."}, "account_entity": {"value": "CreditManagementAccount", "status": "verified", "evidence": "get_service_entities for the exact service identifies the Credit Accounts entity set."}, "account_keys": {"value": ["BusinessPartner", "CreditSegment"], "status": "verified", "evidence": "SAP Help Operations for Credit Management Master Data identifies both keys in the keyed account URL. Graph property metadata confirms both fields are non-null strings; it does not expose key flags."}, "amount_property": {"value": "CreditLimitAmount", "status": "verified", "evidence": "get_srvb_properties: CreditManagementAccount.CreditLimitAmount, Edm.Decimal, label Credit Limit."}, "currency_property": {"value": "CreditSegmentCurrency", "status": "verified", "evidence": "get_srvb_properties: CreditManagementAccount.CreditSegmentCurrency, Edm.String, label Currency."}, "account_view": {"value": "A_CREDITMANAGEMENTACCOUNT", "status": "verified", "evidence": "get_service_entities maps CreditManagementAccount to A_CREDITMANAGEMENTACCOUNT."}, "entity_restrictions": {"value": "creatable=false; updatable=null; deletable=null", "status": "verified", "evidence": "Captured entity-set metadata disables direct creation. The update and delete flags are absent, represented as null by the graph tool. These flags do not establish a read-only entity."}, "table_lineage": {"value": "A_CREDITMANAGEMENTACCOUNT → R_CREDITMGMTACCOUNTTP → R_CREDITMGMTACCOUNT → UKMBP_CMS_SGM + UKMCRED_SGM0C", "status": "verified", "evidence": "Graph structural edges and trace_to_tables confirm three-hop reachability from the API CDS view to both tables. R_CREDITMGMTACCOUNT has selects_from edges to both tables. This is a CDS lineage summary, not a measured runtime SQL trace."}}}</script>
<script>

'use strict';
const data=JSON.parse(document.getElementById('demo-data').textContent);
const state={step:0,node:'account'};
const el=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function val(key){const f=data.facts[key];return f?.status==='verified'?(Array.isArray(f.value)?f.value.join(' + '):f.value):'Unverified';}
function ready(keys){return keys.every(k=>data.facts[k]?.status==='verified');}
const fact=(label,key)=>`<div class="fact"><small>${esc(label)}</small><code class="${data.facts[key]?.status==='verified'?'':'unverified'}">${esc(val(key))}</code></div>`;
function evidence(keys){return '<details><summary>Retrieved metadata</summary>'+keys.map(k=>'<p><b>'+esc(k.replaceAll('_',' '))+'</b><br>'+esc(data.facts[k]?.evidence||'No supporting evidence retrieved.')+'</p>').join('')+'</details>';}
function graph(){
 el('canvas').innerHTML=`<div class="eyebrow">Ontology · business view</div><h2>The limit belongs to a credit account</h2><p class="lead">A business partner and a credit segment identify the account within a client.</p><p class="small-note">For a classic ABAP report where table access is permitted.</p><div class="concepts"><span>Business partner</span><span>+ Credit segment</span><span>→ Credit account</span></div><div class="nodes"><button class="node" data-node="account" aria-pressed="${state.node==='account'}"><span>Business object</span><strong>Credit account</strong><code>${esc(val('credit_table'))}</code></button><span class="arrow">→</span><button class="node" data-node="segment" aria-pressed="${state.node==='segment'}"><span>Configuration</span><strong>Credit segment</strong><code>${esc(val('segment_table'))}</code></button></div><div class="edge">${esc(val('segment_relationship'))}</div><div class="callout">${ready(['amount_field','currency_field','segment_relationship'])?'The amount is on the account. The currency comes from its credit segment.':'Some relationships remain unverified. Review the retrieved metadata before using the design.'}</div><p class="mini">Click either object to inspect its SAP fields. This business view is based on table keys and foreign-key metadata; it is not an exported ontology.</p>`;
 if(state.node==='account')el('inspector').innerHTML=`<span class="pill">S/4 metadata</span><h2>Identify the exact account</h2><div class="source">${esc(val('credit_table'))}</div>${fact('Business key, within the client','business_key')}${fact('Physical table key','physical_key')}${fact('Existing credit-limit amount','amount_field')}<p class="small-note">The partner alone is insufficient when that partner has more than one credit segment.</p>${evidence(['credit_table','business_key','physical_key','amount_field'])}`;
 else el('inspector').innerHTML=`<span class="pill">S/4 metadata</span><h2>Give the amount its currency</h2><div class="source">${esc(val('segment_table'))}</div>${fact('Relationship key','segment_key')}${fact('Configured segment currency','currency_field')}<div class="callout">Follow the relationship before interpreting the number.</div>${evidence(['segment_table','segment_key','currency_field','segment_relationship'])}`;
}

const apiKeys=['service','protocol','endpoint','account_entity','account_keys','amount_property','currency_property'];
const apiDocs='https://help.sap.com/docs/SAP_S4HANA_CLOUD/ce8c2b9687e94c2eb70ab34e92e6fba5/82fb5abf2c5f4a919ee3060df8b2692f.html?locale=en-US&state=PRODUCTION&version=2602.500';
function getRequest(){
 if(!ready(apiKeys))return 'API facts are incomplete. Verify the service, entity and account keys.';
 const keys=data.facts.account_keys.value;
 return 'GET '+val('endpoint')+'/'+val('account_entity')+'('+keys[0]+"='DEMO-01',"+keys[1]+"='A')";
}
function apiDetails(){return `<details><summary>Service metadata and sources</summary>${fact('Release state in the graph','release_state')}${fact('Package','service_package')}${fact('Entity-set restrictions','entity_restrictions')}<p>creatable=false disables direct creation. It does not establish a read-only entity. This walkthrough uses reads only.</p><p>The S/4 tools returned service, entity and property metadata. SAP documentation confirms the two keys in the account-read URL.</p><a href="${esc(apiDocs)}" target="_blank" rel="noopener noreferrer">SAP documentation: credit-account operations</a>${evidence(apiKeys)}</details>`;}
function apiRead(){
 el('canvas').innerHTML=`<div class="eyebrow">OData API option</div><h2>Read a credit account</h2><p class="lead">One GET request returns the current limit and currency for the account.</p><div class="api-service"><span>${esc(val('release_state'))} · ${esc(val('protocol'))}</span><strong>${esc(val('service'))}</strong><code>Entity set: ${esc(val('account_entity'))}</code><dl class="api-exchange"><div><dt>Provide</dt><dd><strong>Partner + segment</strong><code>${esc(val('account_keys'))}</code></dd></div><div><dt>Receive</dt><dd><strong>Limit + currency</strong><code>${esc(val('amount_property'))}<br>${esc(val('currency_property'))}</code></dd></div></dl></div><p class="mini">The same business account as the table option, accessed through a remote API.</p>`;
 const common=`<details><summary>Example GET request</summary><div class="source"><pre>${esc(getRequest())}</pre></div><p>Prepared request example with fictional identifiers. It has not been executed. Use your target endpoint and correctly formatted account values.</p></details><p class="small-note">The remote service must be activated and accessible in the target system. Release metadata alone does not confirm access.</p>${apiDetails()}`;
 el('inspector').innerHTML=`<span class="pill">One account · one GET request</span><h2>Use it from your application</h2><p class="lead">For a separate app, such as one on BTP, this is the remote read interface.</p><div class="callout">${ready(apiKeys)?'The API exposes the limit and currency together. The caller does not need to join the tables.':'Some API fields are unverified. Review the source metadata before using this design.'}</div>${common}`;
}
function render(){
 el('mode').textContent=(data.mode==='fresh'?'Fresh MCP retrieval':'Prepared from S/4 findings')+' · '+data.retrieved_at;
 document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.step)===state.step)));
 [graph,apiRead][state.step]();
 el('back').disabled=state.step===0;el('next').textContent=state.step===1?'Restart ↺':'Next →';el('position').textContent=(state.step+1)+' / 2';
}
function go(n){state.step=Math.max(0,Math.min(1,n));render();el('announce').textContent='Option '+(state.step+1)+' of 2';}
function restart(){Object.assign(state,{step:0,node:'account'});render();el('announce').textContent='Returned to the table read option';}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.step))));
el('back').addEventListener('click',()=>go(state.step-1));
el('next').addEventListener('click',()=>state.step===1?restart():go(state.step+1));
document.addEventListener('click',e=>{const n=e.target.closest('[data-node]');if(!n||!['account','segment'].includes(n.dataset.node))return;state.node=n.dataset.node;render();document.querySelector('[data-node="'+state.node+'"]')?.focus();});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(state.step+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(state.step-1);}});
render();

</script>
